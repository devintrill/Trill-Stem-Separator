<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SampleSmith</title>
<style>/*STYLE*/</style>
</head>
<body>
<div class="app-bg" aria-hidden="true"><div class="haze"></div><div class="grid"></div></div>
<div class="aura" id="aura" aria-hidden="true"></div>

<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="logo" id="logo" data-state="ready" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <span class="word">samplesmith</span>
    </div>
    <div class="pills">
      <button class="pill update" id="update" hidden><i></i><span>Update</span></button>
      <div class="pill gpu" id="gpu"><i></i><span>Checking GPU</span></div>
    </div>
  </header>

  <main class="cols">
    <section class="card samples arrive">
      <div class="row head">
        <span class="eyebrow">Samples</span>
        <span class="count" id="count"></span>
        <button class="btn ghost sm" id="clear">Clear</button>
      </div>
      <button class="drop" id="drop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0l-4 4m4-4l4 4M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>
        <span>Drop samples or click</span>
      </button>
      <div class="row yt">
        <input id="yt" class="field" placeholder="Paste YouTube link" spellcheck="false" autocomplete="off">
        <button class="btn tint" id="yt-add"><span class="fill"></span><span class="lbl">Add</span></button>
      </div>
      <div class="yt-error" id="yt-error" role="alert" hidden></div>
      <div class="list" id="files"></div>
    </section>

    <section class="card settings arrive">
      <label class="eyebrow">Model</label>
      <div class="select" id="model"><button class="field select-btn"><span></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="menu"></div></div>

      <label class="eyebrow">Quality</label>
      <div class="seg" id="quality"></div>

      <label class="eyebrow">Format</label>
      <div class="seg" id="format"></div>

      <button class="switch" id="nodrums" role="switch"><span class="track"><span class="thumb"></span></span><span>No drums file</span></button>

      <label class="eyebrow">Save to</label>
      <div class="row out">
        <div class="field path" id="out" title=""></div>
        <button class="btn tint" id="out-change">Change</button>
        <button class="btn tint" id="out-open">Open</button>
      </div>
    </section>
  </main>

  <section class="card stems empty" id="stems">
    <div class="row head">
      <span class="eyebrow">Stems</span>
      <span class="hint" id="stems-hint"></span>
      <div class="select result" id="result"><button class="field select-btn"><span></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><div class="menu"></div></div>
      <span class="tags" id="result-tags"></span>
      <button class="play" id="play" disabled><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button>
      <input type="range" class="seek" id="seek" min="0" max="1000" value="0" disabled>
      <span class="time" id="ptime">0:00 / 0:00</span>
      <button class="chip drag" id="all" title="Drag into your DAW"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>All</button>
    </div>
    <div class="strips" id="strips"></div>
    <!-- the pencil on a stem opens this over the stems: Match, Loop and MIDI make new files from it -->
    <div class="editor" id="editor" hidden>
      <div class="ed-head">
        <svg class="ed-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>
        <span class="ed-title" id="ed-name"></span>
        <div class="seg ed-tabs" id="ed-tabs"></div>
        <span class="ed-from" id="ed-from"></span>
        <button class="x" id="ed-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="ed-row">
        <div class="ed-tool" data-tool="match">
          <span class="ed-label">Your project</span>
          <input class="field ed-bpm" id="ed-bpm" inputmode="decimal" placeholder="Tempo" spellcheck="false" autocomplete="off" maxlength="6">
          <span class="ed-unit">BPM</span>
          <div class="ed-key" id="ed-key">
            <button class="ed-step" id="ed-prev" aria-label="Key down">‹</button>
            <button class="ed-keytext" id="ed-keytext"></button>
            <button class="ed-step" id="ed-next" aria-label="Key up">›</button>
            <button class="ed-mode" id="ed-mode"></button>
          </div>
          <span class="ed-hint ed-plan" id="ed-plan"></span>
        </div>
        <div class="ed-tool" data-tool="loop">
          <div class="seg ed-bars" id="ed-bars"></div>
          <div class="ed-key">
            <button class="ed-step" id="ed-bar-prev" aria-label="Earlier bar">‹</button>
            <span class="ed-keytext ed-bar" id="ed-bar"></span>
            <button class="ed-step" id="ed-bar-next" aria-label="Later bar">›</button>
          </div>
        </div>
        <div class="ed-tool" data-tool="midi">
          <span class="ed-hint" id="ed-midi-hint"></span>
        </div>
        <button class="btn cta ed-go" id="ed-go"></button>
      </div>
      <div class="ed-out" id="ed-out"></div>
    </div>
  </section>

  <footer class="card card-featured foot arrive">
    <div class="row">
      <span class="status" id="status">Ready</span>
      <span class="time" id="elapsed"></span>
      <button class="btn ghost sm" id="log-btn">Log</button>
      <button class="btn stop" id="stop" disabled>Stop</button>
      <button class="btn cta" id="go">Separate</button>
    </div>
    <div class="bar" id="bar"><div class="bar-fill" id="bar-fill"><span class="sheen"></span></div></div>
    <div class="log" id="log"><pre id="log-text"></pre></div>
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button class="btn tint sm" id="toast-undo">Undo</button><i class="toast-bar"></i></div>
<div class="credit">Made by Trill · © 2026</div>
<div class="dropping" id="dropping"><div>Drop to add</div></div>
<script>/*SCRIPT*/</script>
</body>
</html>
